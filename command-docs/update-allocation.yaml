command: update-allocation

arguments:
  id: >-
    Allocation ID or name as shown by `dci list-allocations`. Names resolve
    (exact, unique substring, or close typo); pass `--id` to force a literal ID.

examples:
  - description: Turn on anomaly detection for a single allocation.
    command: "dci update-allocation \"Team Backyard\" anomalyDetection: true"
  - description: Rename it and move it to a folder.
    command: "dci update-allocation <allocation-id> name: \"Team Backyard (prod)\", folderId: <folder-id>"
  - description: Replace the rule so it matches either of two billing accounts, with the body read from a file.
    command: "dci update-allocation <allocation-id> < allocation.json"
    output: |
      # allocation.json
      {"rule": {"formula": "A",
                "components": [{"key": "billing_account_id", "type": "fixed", "mode": "is",
                                "values": ["012345-ABCDEF-678901", "ABCDEF-012345-678901"]}]}}
  - description: Pull the current allocation, edit it, and push it back as code.
    command: "dci update-allocation <allocation-id> < allocation.json"
    output: >-
      Start from `dci get-allocation <allocation-id> --output json > allocation.json`,
      edit, then push; the response is the updated allocation.

related: [get-allocation, create-allocation, list-allocations, delete-allocation]
