command: get-service-account

arguments:
  id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.

examples:
  - description: Show one service account and its permissions, by name.
    command: "dci get-service-account terraform-ci"
  - description: The full record as JSON, including the `etag` that update and delete take as `--if-match`.
    command: "dci get-service-account <service-account-id> --output json"
  - description: Only the current ETag.
    command: "dci get-service-account <service-account-id> --fields etag --output json"

notes: |
  Requires the `serviceAccountViewer` permission. An ID that belongs to another customer
  returns `404`.

related: [list-service-accounts, update-service-account, delete-service-account, list-service-account-tokens]
