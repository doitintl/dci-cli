command: list-allocations

examples:
  - description: Your allocations, newest update first.
    command: "dci list-allocations"
  - description: Custom (non-preset) allocations only, sorted by name.
    command: "dci list-allocations --filter type:custom --sort-by name --sort-order asc"
  - description: Allocations in one folder whose name contains a word (ANDs with --filter).
    command: "dci list-allocations --filter folderId:<folder-id> --name-contains backyard"
  - description: Every page as JSON, for scripts.
    command: "dci list-allocations --all --output json"
  - description: Browse in the full-screen viewer; Enter prints the selected allocation's id.
    command: "dci list-allocations -M interactive"

notes: |
  :::info CLI default view
  `dci list-allocations` presents a curated table by default:

  - **Columns:** `name` (a clickable link to the allocation in the DoiT console in interactive terminals), `owner`, `type`, `folder` (`folderId` resolved to the folder name; blank for top-level allocations), and `updated (UTC)`.
  - In interactive tables, `updated (UTC)` renders in your **local timezone** and is titled `updated (local)`; machine formats, agent mode, and `--utc` keep UTC — see [Timestamps and timezones](/docs/cli#timestamps).
  - **Rows are sorted by last update, newest first.**
  - `--output json` and explicit `-C`/`--fields` selections return the raw fields documented below.
  :::

related: [get-allocation, create-allocation, update-allocation, delete-allocation]
