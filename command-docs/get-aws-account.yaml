command: get-aws-account

arguments:
  account-id: >-
    12-digit AWS account ID of a CloudConnect-connected account (the `accountID` given to
    `dci create-account-role`).

examples:
  - description: Show the connected account's role, enabled features and S3 bucket configuration.
    command: "dci get-aws-account <account-id>"
  - description: The full record as JSON, for scripts.
    command: "dci get-aws-account <account-id> --output json"
  - description: Only the fields you need, for example to check permissions per feature.
    command: "dci get-aws-account <account-id> --fields accountID,enabledFeatures,supportedFeatures --output json"

related: [create-account-role, update-aws-feature, delete-account-role, get-cloud-connect-supported-features]
