command: get-entity-invoice-explainer

arguments:
  billing-profile-id: >-
    Billing profile identifier shown on the invoice.
  invoice-number: >-
    Customer-facing invoice number, as shown in the `invoice` column of `dci list-invoices`.

examples:
  - description: Explain the invoiced cost changes behind one invoice.
    command: "dci get-entity-invoice-explainer <billing-profile-id> <invoice-number>"
  - description: The full breakdown as JSON — accounts, services, and the summary of credits, discounts, refunds, and charges.
    command: "dci get-entity-invoice-explainer <billing-profile-id> <invoice-number> --output json"
  - description: When your credential can access more than one customer, name the tenant explicitly.
    command: "dci get-entity-invoice-explainer <billing-profile-id> <invoice-number> --x-tenant-id <customer-id>"

related: [get-billing-explainer-per-payer, get-invoice, list-invoices]
