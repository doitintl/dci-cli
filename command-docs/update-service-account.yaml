command: update-service-account

arguments:
  id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.

examples:
  - description: Replace the permissions, passing the ETag from `dci get-service-account` (the list you send is the whole new list).
    command: >-
      dci update-service-account <service-account-id> permissions: [cloudAnalyticsReadOnly]
      --if-match <etag> --idempotency-key "$(uuidgen)"
  - description: Preview the result server-side first; the response shows the account as it would look and nothing changes.
    command: "dci update-service-account <service-account-id> name: terraform-prod --if-match <etag> --dry-run"
  - description: Clear the description.
    command: >-
      dci update-service-account <service-account-id> description: ""
      --if-match <etag> --idempotency-key "$(uuidgen)"

notes: |
  Send any of `name`, `description` and `permissions`; the body is a JSON Merge Patch, so
  omitted or `null` fields stay unchanged. An empty string clears `description`, and
  `permissions` replaces the whole list (`[]` removes every permission). Requires the
  `serviceAccountManager` permission.

  The API requires `If-Match` with the current ETag, from the `etag` field of `dci
  get-service-account` or of a create or update response. A stale value returns `412`:
  re-read the account and retry with the new ETag. It also requires an `Idempotency-Key`
  (retrying with the same key returns the stored response; keys are kept for 24 hours).

  :::info Dry run is server-side
  `--dry-run` sends the request with the API's `dryRun=true` and runs the same checks as a real
  update (`If-Match`, name bounds and uniqueness, permission names, caller scope). When you
  omit `--idempotency-key` under `--dry-run`, the CLI generates a throwaway one.
  :::

related:
  [
    get-service-account,
    list-service-accounts,
    create-service-account,
    delete-service-account,
    list-service-account-tokens,
  ]
