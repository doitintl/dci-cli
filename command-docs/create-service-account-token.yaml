command: create-service-account-token

arguments:
  service-account-id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.

examples:
  - description: Mint a token that expires on a given date. Run it with --output json and store the `accessToken` in a secret manager at once.
    command: >-
      dci create-service-account-token <service-account-id> name: ci-pipeline-prod,
      expiresTime: "2027-09-01T08:00:00Z" --idempotency-key "$(uuidgen)" --output json
  - description: Mint a token with the server's default expiry.
    command: 'dci create-service-account-token <service-account-id> name: ci-pipeline-prod --idempotency-key "$(uuidgen)"'
  - description: Check the name server-side first; nothing is created.
    command: "dci create-service-account-token <service-account-id> name: ci-pipeline-prod --dry-run"

notes: |
  :::caution The secret is shown once
  The `accessToken` in the create response is the credential that authenticates as the service
  account. It is returned only by this operation and can never be retrieved again, so store it
  somewhere safe on receipt and treat it like a password. Later get and list calls never
  include it; if it is lost, create a new token and delete the old one.
  :::

  `name` is required (1-100 characters, no leading or trailing whitespace) and unique among
  the account's tokens (`409`). The token inherits the service account's permissions as they
  stand at creation; there is no per-token scoping. An account holds at most 10 tokens (`422`
  at the cap). Requires the `serviceAccountCreator` permission, and the API requires an
  `Idempotency-Key` on every real call.

  :::info Dry run is shallow
  `--dry-run` sends the API's `dryRun=true`, which checks only the name bounds: it does not
  verify that the service account exists, that the name is unused, or that the account is
  under the cap, so a dry run can succeed where the real create returns `404`, `409` or `422`.
  The preview response has `accessToken` as an empty string.
  :::

related:
  [
    list-service-account-tokens,
    get-service-account-token,
    update-service-account-token,
    delete-service-account-token,
    create-service-account,
  ]
