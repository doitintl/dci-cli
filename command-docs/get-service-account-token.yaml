command: get-service-account-token

arguments:
  service-account-id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.
  id: >-
    API token ID, as shown by `dci list-service-account-tokens` (the `id` field). Tokens are
    not resolved by name; pass the ID.

examples:
  - description: Show one token's state, expiry and last use.
    command: "dci get-service-account-token <service-account-id> <token-id>"
  - description: The full record as JSON.
    command: "dci get-service-account-token <service-account-id> <token-id> --output json"
  - description: Only when the token expires and was last used.
    command: "dci get-service-account-token <service-account-id> <token-id> --fields expiresTime,lastUsedTime --output json"

notes: |
  The token secret (`accessToken`) is not included; it is shown only once, by `dci
  create-service-account-token`. Requires the `serviceAccountViewer` permission.

related:
  [
    list-service-account-tokens,
    create-service-account-token,
    update-service-account-token,
    delete-service-account-token,
    get-service-account,
  ]
