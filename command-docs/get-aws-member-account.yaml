command: get-aws-member-account

arguments:
  management-account-id: >-
    12-digit AWS management (payer) account ID of the organization, as shown by
    `dci list-aws-organizations` (`managementAccountId`).
  member-account-id: >-
    12-digit AWS member account ID under that organization, as shown by
    `dci list-aws-member-accounts <management-account-id>` (`memberAccountId`).

examples:
  - description: One member account's commitment overview, 30-day stats, savings totals and potential savings.
    command: "dci get-aws-member-account <management-account-id> <member-account-id>"
  - description: The full record as JSON, including the six-month `monthlyStats` and 30-day `dailyCoverage` series.
    command: "dci get-aws-member-account <management-account-id> <member-account-id> --output json"
  - description: Only the headline numbers.
    command: "dci get-aws-member-account <management-account-id> <member-account-id> --fields displayName,stats30d,monthlyPotentialSavings --output json"

related: [list-aws-member-accounts, get-aws-organization, list-aws-organizations, list-aws-savings-plans]
