command: get-customer-group

arguments:
  customer-group-id: >-
    Customer group ID as shown by `dci list-customer-groups` (the `id` field).

examples:
  - description: Show one customer group and its member customers.
    command: "dci get-customer-group <customer-group-id>"
  - description: The full record as JSON, for scripts or to check membership after an update.
    command: "dci get-customer-group <customer-group-id> --output json"
  - description: Only the member customer IDs.
    command: "dci get-customer-group <customer-group-id> --fields memberCustomerIds --output json"

related: [list-customer-groups, update-customer-group, delete-customer-group, assign-customer-group-user]
