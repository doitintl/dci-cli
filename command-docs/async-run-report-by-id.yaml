command: async-run-report-by-id

arguments:
  id: >-
    Report ID as shown by `dci list-reports`.

examples:
  - description: Run a saved report in the background (the API requires an idempotency key on every submission).
    command: "dci async-run-report-by-id <report-id> --idempotency-key \"$(uuidgen)\""
    output: >-
      `operationId`, `createTime`, and `status` ("pending" or "running"). Poll with
      `dci get-async-operation <operation-id>`, then read the rows with
      `dci get-async-operation-results <operation-id>` once it is "succeeded".
  - description: Override the report's time settings with a relative window (ISO 8601 duration, days back from today).
    command: "dci async-run-report-by-id <report-id> --time-range P30D --idempotency-key \"$(uuidgen)\""
  - description: Override with an explicit date range (both dates required, yyyy-mm-dd).
    command: "dci async-run-report-by-id <report-id> --start-date 2026-01-01 --end-date 2026-01-31 --idempotency-key \"$(uuidgen)\""
  - description: Validate the request without creating an operation (status "dry_run", no operationId).
    command: "dci async-run-report-by-id <report-id> --dry-run --idempotency-key \"$(uuidgen)\""

notes: |
  :::tip Sync or async?
  `dci get-report <report-id>` runs the same report synchronously and renders the
  pivot table. Use the async form for long-running reports or when a script
  should submit now and collect later; `--time-range` cannot be combined with
  `--start-date`/`--end-date`.
  :::

related: [async-run-inline, get-async-operation, get-async-operation-results, cancel-async-operation, get-report]
