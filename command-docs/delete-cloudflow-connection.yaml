command: delete-cloudflow-connection

arguments:
  connection-id: >-
    Connection ID (`connectionId`) as shown by `dci list-cloudflow-connections`. Connections are
    addressed by ID only; name resolution does not apply.

examples:
  - description: Preview the deletion locally without sending anything.
    command: "dci delete-cloudflow-connection <connection-id> --dry-run"
  - description: Delete without a prompt, for scripts.
    command: "dci delete-cloudflow-connection <connection-id> --yes"
    output: Exit code 0 and no output (HTTP 204); a connection still referenced by a flow returns 409.

notes: |
  :::caution Confirmation required
  Interactive terminals show a confirmation prompt; scripts must pass `--yes` — see the CLI
  guide's [Destructive commands](/docs/cli#destructive-commands). Deleting fails with `409`
  while any flow still references the connection; rebind or delete those flows first.
  :::

related:
  [list-cloudflow-connections, get-cloudflow-connection, update-cloudflow-connection, create-cloudflow-connection]
