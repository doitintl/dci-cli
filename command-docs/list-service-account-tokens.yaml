command: list-service-account-tokens

arguments:
  service-account-id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.

examples:
  - description: The API tokens of one service account, with state and expiry.
    command: "dci list-service-account-tokens <service-account-id>"
  - description: Just the token IDs, names, state and expiry, as JSON.
    command: "dci list-service-account-tokens <service-account-id> --fields id,name,state,expiresTime --output json"
  - description: Find tokens that are due to expire (compare `expiresTime` rather than trusting `state`).
    command: "dci list-service-account-tokens <service-account-id> --fields name,state,expiresTime,lastUsedTime"

notes: |
  A service account has at most 10 non-deleted tokens, all returned in one response. The
  token secret is never shown here; it is returned once, by `dci create-service-account-token`.
  `state` is the stored state, not a liveness signal: an expired token keeps its stored
  `active` state, so check `expiresTime`. Requires the `serviceAccountViewer` permission.

related:
  [
    create-service-account-token,
    get-service-account-token,
    update-service-account-token,
    delete-service-account-token,
    get-service-account,
  ]
