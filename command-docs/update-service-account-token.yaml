command: update-service-account-token

arguments:
  service-account-id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.
  id: >-
    API token ID, as shown by `dci list-service-account-tokens` (the `id` field). Tokens are
    not resolved by name; pass the ID.

examples:
  - description: Disable a token; it stops authenticating immediately until it is re-enabled.
    command: 'dci update-service-account-token <service-account-id> <token-id> state: disabled --idempotency-key "$(uuidgen)"'
  - description: Re-enable it.
    command: 'dci update-service-account-token <service-account-id> <token-id> state: active --idempotency-key "$(uuidgen)"'
  - description: Preview the change server-side; the response shows the token as it would look and nothing is written.
    command: "dci update-service-account-token <service-account-id> <token-id> state: active --dry-run"

notes: |
  `state` accepts only `active` and `disabled`; any other value, `deleted` and `expired`
  included, returns `400` (use `dci delete-service-account-token` to delete). Setting the state
  a token already has succeeds and changes nothing. Re-enabling a token whose expiry has passed
  returns `422`, because expiry is final: create a new token instead. Disabling an expired token
  succeeds. Requires the `serviceAccountManager` permission, and the API requires an
  `Idempotency-Key` on every real call.

  With `--dry-run` (the API's `dryRun=true`), a `422` means the real request would be refused
  too. When you omit `--idempotency-key` under `--dry-run`, the CLI generates a throwaway one.

related:
  [
    get-service-account-token,
    list-service-account-tokens,
    create-service-account-token,
    delete-service-account-token,
    update-service-account,
  ]
