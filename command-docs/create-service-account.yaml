command: create-service-account

examples:
  - description: Create a service account with a set of permissions (camelCase names, as in the Console role editor).
    command: >-
      dci create-service-account name: terraform-ci, description: "Manages DoiT resources from CI",
      permissions: [cloudAnalyticsReadOnly, budgetsManager] --idempotency-key "$(uuidgen)"
  - description: Check the request server-side first; nothing is created and the CLI supplies a throwaway idempotency key.
    command: "dci create-service-account name: terraform-ci, permissions: [cloudAnalyticsReadOnly] --dry-run"
  - description: Create it from a JSON file and capture the new ID, to mint its first API token next.
    command: 'dci create-service-account --idempotency-key "$(uuidgen)" --output json < service-account.json | jq -r .id'
    output: |
      # service-account.json
      {"name": "terraform-ci", "description": "Manages DoiT resources from CI",
       "permissions": ["cloudAnalyticsReadOnly", "budgetsManager"]}

notes: |
  Only `name` is required (1-100 characters, no leading or trailing whitespace, unique among
  the customer's service accounts, `409` otherwise). An unknown permission name returns `422`.
  Requires the `serviceAccountCreator` permission.

  A new service account cannot authenticate anything until it has an API token: mint one with
  `dci create-service-account-token`. The API requires an `Idempotency-Key` on every real
  call; retrying with the same key and request returns the stored response (keys are kept for
  24 hours).

  :::info Dry run is server-side
  `--dry-run` sends the request with the API's `dryRun=true`: it runs the same checks as a real
  create (name bounds and uniqueness, permission names, caller scope) and returns the same
  errors without creating anything. In the response, `id`, `createTime`, `updateTime` and
  `etag` are `null`.
  :::

