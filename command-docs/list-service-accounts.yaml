command: list-service-accounts

examples:
  - description: The service accounts your organization owns, with their permissions.
    command: "dci list-service-accounts"
  - description: Just the IDs and names, to pick a `<service-account-id>`.
    command: "dci list-service-accounts --fields id,name --output json"
  - description: Everything as JSON, for scripts.
    command: "dci list-service-accounts --output json"

notes: |
  A service account is a non-human identity; its API tokens authenticate with exactly the
  permissions listed on the account. Requires the `serviceAccountViewer` permission. The whole
  list comes back in one response, in no guaranteed order, so there is no paging.

related:
  [
    get-service-account,
    create-service-account,
    update-service-account,
    delete-service-account,
    list-service-account-tokens,
  ]
