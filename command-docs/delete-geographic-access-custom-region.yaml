command: delete-geographic-access-custom-region

arguments:
  custom-region-id: >-
    Custom region ID as shown by `dci list-geographic-access-custom-regions`.
    The region name is accepted too.

examples:
  - description: Preview the deletion without sending a request.
    command: "dci delete-geographic-access-custom-region <custom-region-id> --dry-run"
    output: A local preview of the operation; nothing is deleted.
  - description: Delete without the confirmation prompt, for scripts.
    command: "dci delete-geographic-access-custom-region <custom-region-id> --yes"
    output: Exit code 0 and no output; the region disappears from `dci list-geographic-access-custom-regions`.

notes: |
  :::caution Assigned regions cannot be deleted
  A region still referenced by a customer or user scope is rejected by the API.
  Reassign those scopes first with `dci update-customer-geographic-access-scope`
  or `dci update-user-geographic-access-scope`, or clear them with the matching
  `delete-*-geographic-access-scope` command.
  :::

related: [list-geographic-access-custom-regions, get-geographic-access-custom-region, update-geographic-access-custom-region, create-geographic-access-custom-region]
