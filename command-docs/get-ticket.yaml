command: get-ticket

arguments:
  ticket-id: >-
    Numeric ticket ID as shown by `dci list-tickets` (the `id` field in JSON output).
    Tickets have no names, so name resolution does not apply.

examples:
  - description: Show one support request.
    command: "dci get-ticket <ticket-id>"
  - description: The full record as JSON, including `tags` and `platform_info`.
    command: "dci get-ticket <ticket-id> --output json"
  - description: Only the fields you need.
    command: "dci get-ticket <ticket-id> --fields id,status,severity,tags,urlUI --output json"

related: [list-tickets, list-ticket-comments, list-ticket-tags, update-ticket]
