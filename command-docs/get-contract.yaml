command: get-contract

arguments:
  customer-id: >-
    ID of the customer (tenant) that holds the contract — your own tenant or, for partners, a
    descendant tenant. It is the `customerId` field on every `dci list-contracts` row.
  contract-id: >-
    Contract ID (`id`) as shown by `dci list-contracts <customer-id>`. Contracts are not
    resolved by name.

examples:
  - description: Show one contract.
    command: "dci get-contract <customer-id> <contract-id>"
  - description: The full record as JSON, including every version.
    command: "dci get-contract <customer-id> <contract-id> --output json"
  - description: Only the version history.
    command: "dci get-contract <customer-id> <contract-id> --fields versions --output json"

related: [list-contracts, create-contract, update-contract, activate-contract, cancel-contract]
