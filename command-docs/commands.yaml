command: commands

examples:
  - description: Find the command for a task described in plain words — the best matches, with a curated example each.
    command: 'dci commands --search "budgets about to overspend"'
  - description: The same search as JSON (what agents get by default), with the matched words and a next-step hint.
    command: 'dci commands --search "delete a report" --json'
  - description: The machine-readable catalog of every command, with arguments, flags, and curated examples.
    command: "dci commands --json"
  - description: Include beta commands (invoked as dci beta <command>).
    command: "dci commands --json --beta"
  - description: Which commands are destructive.
    command: 'dci commands --json | jq -r ''.commands[] | select(.destructive) | .path | join(" ")'''
