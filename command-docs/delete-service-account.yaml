command: delete-service-account

arguments:
  id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); the confirmation shows the resolved target.

examples:
  - description: Check the deletion server-side without performing it (the CLI supplies a throwaway idempotency key).
    command: "dci delete-service-account <service-account-id> --if-match <etag> --dry-run"
  - description: Delete the account without an interactive prompt, for scripts.
    command: 'dci delete-service-account <service-account-id> --if-match <etag> --idempotency-key "$(uuidgen)" --yes'

notes: |
  :::caution Permanent
  Deleting a service account also deletes all of its API tokens, which stop authenticating
  immediately. Requires the `serviceAccountManager` permission. Deleting an ID that no longer
  exists returns `404`.
  :::

  The API requires `If-Match` with the current ETag (the `etag` field of `dci
  get-service-account`); a stale value returns `412`. It also requires an `Idempotency-Key`.

related:
  [
    get-service-account,
    list-service-accounts,
    create-service-account,
    update-service-account,
    delete-service-account-token,
  ]
