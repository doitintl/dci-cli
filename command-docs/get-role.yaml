command: get-role

arguments:
  id: >-
    Role ID or name as shown by `dci list-roles`. Names resolve (exact, unique substring, or
    close typo); pass `--id` to force a literal ID.

examples:
  - description: Show one role, by name.
    command: 'dci get-role "FinOps Analyst"'
  - description: The full record as JSON, including the permission IDs.
    command: "dci get-role <role-id> --output json"
  - description: Only the permission IDs, for example to copy into another role.
    command: "dci get-role <role-id> --fields permissions --output json"

notes: |
  Preset roles are visible to every customer; a custom role is returned only to the customer
  that owns it, and an unknown ID or another customer's role returns `404`.

related: [list-roles, create-role, update-role, delete-role]
