command: delete-annotation

arguments:
  id: "Annotation ID as shown by `dci list-annotations` (select the `id` column with `-C id,content`)."

examples:
  - description: Preview what would be deleted, without sending a request.
    command: "dci delete-annotation <annotation-id> --dry-run"
  - description: Delete without a prompt, for scripts and CI (interactive terminals ask first).
    command: "dci delete-annotation <annotation-id> --yes"
    output: Exit code 0 and no output; `dci list-annotations` no longer lists the annotation.

related: [create-annotation, get-annotation, list-annotations, update-annotation]
