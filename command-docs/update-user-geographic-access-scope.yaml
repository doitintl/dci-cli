command: update-user-geographic-access-scope

arguments:
  target-customer-id: >-
    Customer ID of the hierarchy root or one of its child customers.
    `dci get-customer --output json` shows the authenticated customer's ID.
  user-id: User ID as shown by `dci list-users`; the user must belong to the target customer.

examples:
  - description: Limit a user to one country (ISO 3166-1 alpha-2 code from `dci list-geographic-access-countries`).
    command: "dci update-user-geographic-access-scope <target-customer-id> <user-id> type: country, countryCode: DE"
  - description: Limit the user to a custom region (ID from `dci list-geographic-access-custom-regions`).
    command: "dci update-user-geographic-access-scope <target-customer-id> <user-id> type: customRegion, customRegionId: <custom-region-id>"
  - description: Allow the user every country and custom region.
    command: "dci update-user-geographic-access-scope <target-customer-id> <user-id> type: global"
    output: The updated scope is returned; `type` tells you which shape applied.

notes: |
  :::info One shape per request
  The body is exactly one of `type: global`, `type: country` with `countryCode`,
  or `type: customRegion` with `customRegionId`; the request replaces the
  previous scope atomically. To leave the user unassigned, use
  `dci delete-user-geographic-access-scope` instead.
  :::

related:
  [
    get-user-geographic-access-scope,
    delete-user-geographic-access-scope,
    update-customer-geographic-access-scope,
    list-geographic-access-countries,
    list-geographic-access-custom-regions,
  ]
