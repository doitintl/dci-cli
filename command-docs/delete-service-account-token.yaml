command: delete-service-account-token

arguments:
  service-account-id: >-
    Service account ID or name as shown by `dci list-service-accounts`. Names resolve (exact,
    unique substring, or close typo); pass `--id` to force a literal ID.
  id: >-
    API token ID, as shown by `dci list-service-account-tokens` (the `id` field). Tokens are
    not resolved by name; pass the ID.

examples:
  - description: Check the deletion server-side without performing it (the CLI supplies a throwaway idempotency key).
    command: "dci delete-service-account-token <service-account-id> <token-id> --dry-run"
  - description: Delete the token without an interactive prompt, for scripts.
    command: 'dci delete-service-account-token <service-account-id> <token-id> --idempotency-key "$(uuidgen)" --yes'

notes: |
  :::caution Permanent
  A deleted token stops authenticating immediately and cannot be restored. To pause a token
  instead, use `dci update-service-account-token ... state: disabled`. Deleting an ID that no
  longer exists returns `404`. Requires the `serviceAccountManager` permission.
  :::

  The API requires an `Idempotency-Key` on every real call.

related:
  [
    list-service-account-tokens,
    get-service-account-token,
    update-service-account-token,
    create-service-account-token,
    delete-service-account,
  ]
