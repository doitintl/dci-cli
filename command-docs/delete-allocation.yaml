command: delete-allocation

arguments:
  id: >-
    Allocation ID or name as shown by `dci list-allocations`. Names resolve
    (exact, unique substring, or close typo); the confirmation shows the resolved target.

examples:
  - description: Preview what would be deleted, without sending a request.
    command: "dci delete-allocation \"Team Backyard\" --dry-run"
  - description: Delete without a prompt, for scripts and CI (interactive terminals ask first).
    command: "dci delete-allocation <allocation-id> --yes"
    output: Exit code 0 and no output; `dci list-allocations` no longer lists the allocation.

notes: |
  :::caution Allocations in use cannot be deleted
  The API answers 409 Conflict when the allocation is still used by other
  resources. The error body lists each referencing resource with its `id`,
  `name`, and `owner`; remove those references first, then delete again.
  :::

related: [create-allocation, get-allocation, list-allocations, update-allocation]
