command: get-annotation

arguments:
  id: "Annotation ID as shown by `dci list-annotations` (select the `id` column with `-C id,content`)."

examples:
  - description: Show one annotation.
    command: "dci get-annotation <annotation-id>"
  - description: The full record as JSON, including label ids and report ids.
    command: "dci get-annotation <annotation-id> --output json"
  - description: Only the fields you need.
    command: "dci get-annotation <annotation-id> --fields content,timestamp,reports --output json"

related: [list-annotations, create-annotation, update-annotation, delete-annotation]
