name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Changelog release gate (CHANGELOG-SPEC.md §6): no entry for the tag,
      # or a dead help.doit.com link/anchor in it, stops the release before
      # anything is built. Fix CHANGELOG.md, delete the tag, re-tag.
      - name: Check changelog entry for this tag
        run: ./.github/changelog/check-changelog.sh --gate "${GITHUB_REF#refs/tags/}"

      # Command docs release gate (COMMAND-DOCS-SPEC.md D5): every GA
      # operation in the production spec must have a curated (non-draft)
      # command-docs/<command>.yaml, so a new API endpoint never ships in the
      # CLI without its examples. Fix: `go run ./tools/commanddocs scaffold`,
      # curate, merge, delete the tag, re-tag. Beta operations are exempt
      # (they are not in the production spec).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check command docs cover every operation
        run: |
          curl -sSfL --retry 3 --retry-delay 5 https://api.doit.com/openapi.yaml -o "$RUNNER_TEMP/openapi.yaml"
          go run ./tools/commanddocs coverage -spec "$RUNNER_TEMP/openapi.yaml" -strict

      - name: Release via goreleaser-cross
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e CGO_ENABLED=1 \
            ghcr.io/goreleaser/goreleaser-cross:v1.25.9 \
            release --clean

      - name: Trigger downstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh workflow run "Sync Package Manifests" --field tag="$tag"
          gh workflow run "Post-release Verify" --field tag="$tag"

      # Help Center changelog delivery (CHANGELOG-SPEC.md §7): hand the tag to
      # doiteng/scribe, whose deterministic job renders CHANGELOG.md into the
      # omni draft PR. Runs after the release is published — never blocks
      # binaries. Skips with a notice until the scribe-side job and the
      # dispatch token exist.
      - name: Dispatch changelog delivery to scribe
        env:
          SCRIBE_DISPATCH_TOKEN: ${{ secrets.SCRIBE_DISPATCH_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -z "$SCRIBE_DISPATCH_TOKEN" ]; then
            echo "::notice::SCRIBE_DISPATCH_TOKEN not set — skipping Help Center changelog delivery for $tag"
            exit 0
          fi
          curl -sS --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SCRIBE_DISPATCH_TOKEN" \
            https://api.github.com/repos/doiteng/scribe/dispatches \
            -d "{\"event_type\":\"dci-cli-changelog\",\"client_payload\":{\"tag\":\"$tag\"}}"
