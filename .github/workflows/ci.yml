name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  command-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The command docs (command-docs/*.yaml) are validated against the
      # production OpenAPI spec: every example's command, flags, positional
      # arity, body fields, and enum values must exist (COMMAND-DOCS-SPEC.md
      # D4). The spec is public; the test skips without it so `go test ./...`
      # stays offline elsewhere.
      - name: Fetch the production OpenAPI spec
        run: curl -sSfL --retry 3 --retry-delay 5 https://api.doit.com/openapi.yaml -o "$RUNNER_TEMP/openapi.yaml"

      - name: Validate command docs against the spec
        run: go test -run 'TestCommandDocs' -count=1 .
        env:
          DCI_COMMAND_DOCS_SPEC: ${{ runner.temp }}/openapi.yaml

      # Coverage is a warning, never a PR failure: the API can grow without
      # a dci-cli commit. The release gate (D5) is where missing docs block.
      - name: Report command docs coverage
        run: go run ./tools/commanddocs coverage -spec "$RUNNER_TEMP/openapi.yaml"

  changelog-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint CHANGELOG.md format
        run: ./.github/changelog/check-changelog.sh --lint

  secrets-scan:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
