name: Post-release Verify

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/verify
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --dir dist/verify

      - name: Render formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          bash packaging/render.sh \
            dist/verify/checksums.txt "$version" "$base_url" \
            packaging/homebrew/dci.rb.tmpl dist/verify/dci.rb

      - name: Install via Homebrew formula
        run: |
          brew tap-new verify/test
          cp dist/verify/dci.rb "$(brew --repository)/Library/Taps/verify/homebrew-test/Formula/dci.rb"
          # Homebrew 6.0.2+ auto-trusts a fully-qualified install, so no
          # explicit `brew trust` is needed.
          brew install verify/test/dci
          dci --version
          dci --help >/dev/null
          test -f "$(brew --prefix)/etc/bash_completion.d/dci"
          test -f "$(brew --prefix)/share/zsh/site-functions/_dci"
          test -f "$(brew --prefix)/share/fish/vendor_completions.d/dci.fish"

  linux-deb-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download amd64 deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/verify
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*_amd64.deb" \
            --dir dist/verify

      - name: Install and verify
        run: |
          set -euo pipefail
          pkg="$(find dist/verify -maxdepth 1 -type f -name '*_amd64.deb' | head -n 1)"
          if [ -z "$pkg" ]; then
            echo "ERROR: No amd64 .deb found in dist/verify" >&2
            ls -la dist/verify/
            exit 1
          fi
          sudo dpkg -i "$pkg"
          dci --version
          dci --help >/dev/null
          test -f /usr/share/bash-completion/completions/dci
          test -f /usr/share/zsh/vendor-completions/_dci
          test -f /usr/share/fish/vendor_completions.d/dci.fish

  linux-rpm-smoke:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install gh CLI
        run: dnf install -y gh

      - name: Download amd64 rpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/verify
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*_amd64.rpm" \
            --dir dist/verify

      - name: Install and verify
        run: |
          set -euo pipefail
          pkg="$(find dist/verify -maxdepth 1 -type f -name '*_amd64.rpm' | head -n 1)"
          if [ -z "$pkg" ]; then
            echo "ERROR: No amd64 .rpm found in dist/verify" >&2
            ls -la dist/verify/
            exit 1
          fi
          dnf install -y "$pkg"
          dci --version
          dci --help >/dev/null
          test -f /usr/share/bash-completion/completions/dci
          test -f /usr/share/zsh/site-functions/_dci
          test -f /usr/share/fish/vendor_completions.d/dci.fish

  # Warn-only: regenerates the embedded beta spec and reports drift against
  # what the release shipped. Never fails the verify run — an api-dev outage
  # or a mid-flight API change must not implicate a finished release; the
  # refresh-beta-spec workflow owns the fix (BETA-SPEC.md §2.3).
  beta-spec-staleness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compare shipped beta spec against the live source
        run: |
          if ! go run ./tools/betaspec; then
            echo "::warning::betaspec could not regenerate (source spec unreachable or an operation vanished); the shipped beta spec was not verified"
            exit 0
          fi
          if git diff --quiet -- beta/openapi.beta.yaml; then
            echo "Shipped beta spec matches the live source."
          else
            echo "::warning::the shipped beta spec is stale — run the Refresh Beta Spec workflow and merge its PR before the next release"
            git diff --stat -- beta/openapi.beta.yaml
          fi

  windows-zip-smoke:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download amd64 zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/verify
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*_windows_amd64.zip" \
            --dir dist/verify

      - name: Extract and verify
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/verify/*_windows_amd64.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist/verify/windows
          & "$PWD\dist\verify\windows\dci.exe" --version
          & "$PWD\dist\verify\windows\dci.exe" --help | Out-Null
          if (-not (Test-Path "dist/verify/windows/completions/dci.ps1")) {
            throw "completions/dci.ps1 missing from windows zip"
          }
