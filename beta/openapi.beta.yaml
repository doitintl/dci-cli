    "404":
      description: Not Found - The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "422":
      description: Unprocessable Entity - The request is well-formed but semantically invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "425":
      description: Too Early - The operation has not yet reached a terminal state. Poll the operation status endpoint, which returns its own Retry-After guidance, until it succeeds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Internal Server Error - Something went wrong with the DoiT API server.
      content:
        application/json:
